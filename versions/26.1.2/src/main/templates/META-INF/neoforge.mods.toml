license="${mod_license}"
issueTrackerURL="https://github.com/Sanchezcorp121/better-selection-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Sanchezcorp121/better-selection-neoforge"
logoFile="betterselection.png"
credits="Unofficial NeoForge port of Better Selection by MDLC01."
description='''
Makes text more pleasant to select: Ctrl+Left/Right jump between words like in a normal text editor.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
