modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sanchezcorp121/better-selection-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Sanchezcorp121/better-selection-neoforge"
logoFile="betterselection.png"
credits="Unofficial Forge port of Better Selection by MDLC01."
description='''
Makes text more pleasant to select: Ctrl+Left/Right jump between words like in a normal text editor.
'''
# client-only, so servers and clients without the mod can still connect
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
